# annona 完整栈：5 服务。
#   db       PostgreSQL 16 + pgvector + citext（不用官方 postgres:16，
#            缺 vector 扩展 Flyway V1 会 fail，per dockerless ADR §CI 矩阵）
#   cache    Redis 7（会话 / Stream / 限流）
#   storage  MinIO（S3 兼容；bucket 通过 MINIO_DEFAULT_BUCKETS 自动建，
#            不用单独的 createbuckets init container）
#   server   annona-server 单 jar（内含 annona-web static，见 B3）
#   web      nginx 反代，host:80；SPA fallback 目前落到 server 的 static
#            处理（deep-link 需 P1a 补 WebMvcConfigurer；见 deploy/nginx/annona.conf）
#
# 所有敏感变量走 --env-file .env（Makefile 里默认注入）。compose 用 `:?` 强
# 校验非空，缺关键变量时启动直接失败，与 StartupValidator 的 fail-fast 语义对齐。

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: annona
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      POSTGRES_DB: annona
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annona -d annona"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 5432 不映射到 host：server 与 db 通过 compose 网络互访；本机直连请走 compose.dev.yml

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # MinIO archived the community edition on 2026-02-13 and purged every tag
    # from Docker Hub by mid-September 2026 (`minio/minio` and `bitnami/minio`
    # both gone). quay.io is the only still-published mirror, but its tag
    # namespace starts at ~2025-04 (Jan 2025 tags never made it over). Bumped
    # from RELEASE.2025-01-20T14-49-07Z (B4 pin, now 404 everywhere) to
    # RELEASE.2025-09-07T16-13-09Z (verified pull on quay.io via community
    # reports 2026-09-17 and milvus-io/milvus#53430 pattern).
    # Long-term replacement (Garage MIT / SeaweedFS Apache 2.0 / Silo) is
    # tracked as tech debt D13 in docs/reports/P0-骨架-阶段总结.md §5.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      # 官方支持的自举建桶方式；bucket 名与 annona-server 的 S3_BUCKET 一致
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-annona}
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/annona
      SPRING_DATASOURCE_USERNAME: annona
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-annona}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      # StartupValidator（B2）在 prod/docker profile 缺 KEK 会直接拒绝启动；
      # `:?` 让 compose 阶段就报可读错，而不是等到应用启动。
      ANNONA_SECRET_KEY: ${ANNONA_SECRET_KEY:?generate with 'openssl rand -base64 32'}
      ANNONA_IDENTITY_MODE: ${ANNONA_IDENTITY_MODE:-local}
      ANNONA_MODEL_MODE: ${ANNONA_MODEL_MODE:-byok}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
    depends_on:
      db:      { condition: service_healthy }
      cache:   { condition: service_healthy }
      storage: { condition: service_healthy }
    expose:
      - "8080"
    # 8080 不映射到 host，唯一入口是 web:80；直接暴露 8080 便于本地调试时手动打开注释
    # ports:
    #   - "8080:8080"

  web:
    image: nginx:1.27-alpine
    volumes:
      - ../deploy/nginx/annona.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      # busybox 的 wget；探活命中 server 的 /actuator/health 经反代
      test: ["CMD", "wget", "-qO-", "http://localhost/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  storage_data:
