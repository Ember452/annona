# annona 依赖升级（对齐 docs/annona-项目结构.md §13.1 dependabot 分组）
#
# 四组：Maven / pnpm / Docker / GitHub Actions。三组走 patch-only 避免
# 每周被 minor 噪声淹没；GitHub Actions 因为版本变化基本无 API 破坏，
# 走全量。所有 PR 打 label 便于筛选。open-pull-requests-limit 限流。
version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # major 升级走人工，配 ADR 记录迁移方案；Boot 4.x -> 5.x 之类
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: ['dependencies', 'java']
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: npm
    directory: /annona-web
    schedule:
      interval: weekly
      day: monday
      time: '03:15'
      timezone: Asia/Shanghai
    package-manager: pnpm-latest
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: ['dependencies', 'frontend']
    commit-message:
      prefix: 'build(deps-web)'

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels: ['dependencies', 'docker']
    commit-message:
      prefix: 'build(deps-docker)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:45'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    # Actions 版本更新几乎无 API 破坏；全量升
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'ci(deps)'
