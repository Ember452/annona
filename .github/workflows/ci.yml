# annona 的 5-job 阻塞型 CI 矩阵
#
# 分工依据：docs/specs/2026-09-25-dockerless-local-dev-adr.md §CI 执行矩阵。
# 本机只跑 `mvn -q verify` 那一层（对应下面的 unit job），其余四层
# （docker-it / compose-smoke / frontend / gitleaks）在 CI 上跑；
# P0-15 里会把这 5 个 job 全部设为 branch protection 的必需检查。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1) 编译 + 纯逻辑单测 + slice + ArchUnit（docker 组被根 pom 的 surefire
  #    <excludedGroups> 默认排除；本机日常就是这一条命令）
  # ─────────────────────────────────────────────────────────────────────
  unit:
    name: Backend unit + ArchUnit (docker excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw (Windows-authored checkouts may drop the exec bit)
        run: chmod +x mvnw
      - name: mvn verify (unit + slice + ArchUnit)
        run: ./mvnw -B -q verify

  # ─────────────────────────────────────────────────────────────────────
  # 2) Flyway 真实迁移 + @Tag("docker") 集测
  #    用 services:（runner 托管，比 compose 快 30-60s，见 dockerless ADR
  #    §CI 执行矩阵）；镜像硬约束：pgvector/pgvector:pg16 不是 postgres:16
  # ─────────────────────────────────────────────────────────────────────
  docker-it:
    name: Integration tests on real PG + Redis (services:)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: annona
          POSTGRES_PASSWORD: annona
          POSTGRES_DB: annona
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U annona -d annona"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw
        run: chmod +x mvnw
      - name: Flyway V1 + docker-tagged ITs
        # 清空根 pom 的 excludedGroups=docker，再用 groups=docker 只跑该组
        run: ./mvnw -B verify -Dgroups=docker -DexcludedGroups=
        env:
          SPRING_PROFILES_ACTIVE: docker
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/annona
          SPRING_DATASOURCE_USERNAME: annona
          SPRING_DATASOURCE_PASSWORD: annona
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          # docker-tagged IT 不真加解密，只要 KEK 非空让 StartupValidator 通过
          ANNONA_SECRET_KEY: ci-dummy-kek-not-used-anywhere-in-tests

  # ─────────────────────────────────────────────────────────────────────
  # 3) compose 冒烟（B4 交付物的端到端；P0 出口条件 ② 的落地）
  #    这是全 CI 里唯一真正需要 docker-compose.yml 的 job——它测交付物
  #    而不是业务逻辑。慢，15-20 分钟；用 paths-ignore 排除文档 PR 已
  #    在 on: 里配好。
  # ─────────────────────────────────────────────────────────────────────
  compose-smoke:
    name: docker compose config + bring up stack + probe /
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compose config (structural validation, incl. extends graph)
        run: docker compose --env-file .env.example -f docker/docker-compose.yml config -q
      - name: Prepare .env with CI-only secrets
        run: |
          cp .env.example .env
          # 覆盖 .env.example 里的 replace-me 占位为可用的 CI 值
          sed -i 's|^ANNONA_SECRET_KEY=.*|ANNONA_SECRET_KEY='"$(openssl rand -base64 32)"'|' .env
          sed -i 's|^SPRING_DATASOURCE_PASSWORD=.*|SPRING_DATASOURCE_PASSWORD=ci-pg-pw|' .env
          sed -i 's|^S3_ACCESS_KEY=.*|S3_ACCESS_KEY=ci-minio-ak|' .env
          sed -i 's|^S3_SECRET_KEY=.*|S3_SECRET_KEY=ci-minio-sk|' .env
      - name: Bring up the full stack
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --wait
      - name: Probe /actuator/health + home page
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after ${i} tries"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost/actuator/health | grep '"status":"UP"'
          curl -fsS http://localhost/ | grep -qi 'annona'
      - name: Dump server logs on failure
        if: failure()
        run: docker compose --env-file .env -f docker/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml down -v

  # ─────────────────────────────────────────────────────────────────────
  # 4) 前端 typecheck + build；顺带校验 static 输出真的落到 annona-server
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: annona-web
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup 读 annona-web/package.json 里的 packageManager 字段
      # 决定 pnpm 版本；放在 setup-node 之前，让 setup-node 的 cache:pnpm
      # 能拿到 pnpm 二进制定位 lockfile。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: annona-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: annona-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify static output reached annona-server
        run: test -f ../annona-server/src/main/resources/static/index.html

  # ─────────────────────────────────────────────────────────────────────
  # 5) gitleaks 权威密钥扫描（本地 pre-commit hook 之外的第二道）
  #    Ember452 目前是个人账号，gitleaks-action@v2 对个人仓库免费；
  #    转成组织后需要 GITLEAKS_LICENSE secret。
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史扫描需要完整 fetch；PR 只 diff 模式可以省，但我们做全扫
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # 组织账号需要，个人仓库不填
