# annona 的 5-job 阻塞型 CI 矩阵
#
# 分工依据：docs/specs/2026-09-25-dockerless-local-dev-adr.md §CI 执行矩阵。
# 本机只跑 `mvn -q verify` 那一层（对应下面的 unit job），其余四层
# （docker-it / compose-smoke / frontend / gitleaks）在 CI 上跑。
#
# branch protection（P0-15）只需把 **`gate` 一个 job 设为必需检查**：
# gate 会汇总五个 blocking job（非 success/skipped 即红）。
# ⚠️ pull_request 触发**不能配 paths-ignore**：过滤命中的 PR 整个 workflow 不触发，
# 不产生任何 check run——若 gate 是必需检查，纯文档 PR 会永久停在 "Expected" 无法
# 合并（GitHub 官方明确告诫勿把路径过滤与必需检查混用）。因此 docs-only PR 也照常
# 跑全量 CI（浪费一些分钟数，换取门禁永远可判定）；push 到 main 保留 paths-ignore
# 省分钟——主干已被 PR 门禁把过一道。
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/FUNDING.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1) 编译 + 纯逻辑单测 + slice + ArchUnit（docker 组被根 pom 的 surefire
  #    <excludedGroups> 默认排除；本机日常就是这一条命令）
  # ─────────────────────────────────────────────────────────────────────
  unit:
    name: Backend unit + ArchUnit (docker excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw (Windows-authored checkouts may drop the exec bit)
        run: chmod +x mvnw
      - name: mvn verify (unit + slice + ArchUnit)
        run: ./mvnw -B -q verify

  # ─────────────────────────────────────────────────────────────────────
  # 2) Flyway 真实迁移 + @Tag("docker") 集测
  #    用 services:（runner 托管，比 compose 快 30-60s，见 dockerless ADR
  #    §CI 执行矩阵）；镜像硬约束：pgvector/pgvector:pg16 不是 postgres:16
  # ─────────────────────────────────────────────────────────────────────
  docker-it:
    name: Integration tests on real PG + Redis (services:)
    runs-on: ubuntu-latest
    # 25 -> 40：批 2 真库 IT 增补后套件实测 25.3min 撞上限（GitHub 标 cancelled 而非
    # failure，与真失败难分辨）；上限给余量，真实时长由 job 用时观察再收敛
    timeout-minutes: 40
    # job 级 env：下面三步（mvn / 断言 / 汇报）都能着到底
    env:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/annona
      SPRING_DATASOURCE_USERNAME: annona
      SPRING_DATASOURCE_PASSWORD: annona
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # docker 组的 IT 不真做加解密，只要 KEK 非空让 StartupValidator 通过
      ANNONA_SECRET_KEY: ci-dummy-kek-not-used-anywhere-in-tests
      # ExtensionMissingIT 用：vanilla postgres:16（无 pgvector）
      BAD_DB_DATASOURCE_URL: jdbc:postgresql://localhost:15432/postgres
      BAD_DB_USER: postgres
      BAD_DB_PASSWORD: postgres
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: annona
          POSTGRES_PASSWORD: annona
          POSTGRES_DB: annona
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U annona -d annona"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # ExtensionMissingIT 需要一个**没有 pgvector**的 vanilla PG（与上面的
      # pgvector 镜像形成对照）；该用例靠 BAD_DB_DATASOURCE_URL 连它。
      # 两个 PG 容器并存，额外成本约 20s。
      badpg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - '15432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw
        run: chmod +x mvnw
      - name: Flyway V1 + docker-tagged ITs
        # 必须同时清掉根 pom 的默认排除（现在走属性，能被覆盖）并指定 groups；
        # 下一步的断言保证“0 个测试”不可能再伪装成绿。
        # pipefail 必须显式打开：默认 bash -e 不管道错误，曾经 mvn 失败而 tee 返回 0，
        # 15 个上下文启动错误被吞成"绿"（667cacb 复盘）。
        # jacoco.skip：覆盖率 60% 门槛的主场是 unit job（全量单测+slice）；本 job 只跑
        # docker 组 IT，its-only 覆盖率随模块增长自然稀释（knowledge 无外部依赖路径
        # 可被 IT 覆盖），拿它过 BUNDLE 检查会把门槛变成随机数（P1a-05 实测 0.46 假红）。
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Dannona.tests.excluded= -Dgroups=docker -Djacoco.skip=true | tee target/docker-it.log
      - name: Assert docker-tagged tests actually ran
        # 只认 surefire 的总 summary 行（无 Time elapsed / 无 "-- in 类名" 后缀）：
        # 旧断言匹配任何单类干净行，FlywayBaselineIT 一行干净就掩护了其余类全部报错（假绿复盘）。
        # 块形 scalar：普通标量里出现“: ”会被 YAML 当映射分隔符解析失败
        run: |
          grep -qE 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: [0-9]+ *$' target/docker-it.log
      - name: Surface docker-it failure digest
        if: failure()
        # 失败摘要写成 ::error:: 注解：checks API 匿名可读，复盘不依赖日志下载权限；
        # -a 防 maven ANSI 字符让 grep 把日志当二进制。
        run: |
          {
            grep -aE '\[ERROR\] Tests run: [0-9]+, Failures' target/docker-it.log | tail -1
            grep -aE '\[ERROR\] io\.annona\..*<<< (FAILURE|ERROR)!' target/docker-it.log | head -4
            grep -a -m 1 -A 2 'Caused by' target/docker-it.log
          } | head -8 | while IFS= read -r l; do echo "::error::${l:0:380}"; done
      - name: Surface ExtensionMissingIT assertion detail
        if: failure()
        # ExtensionMissingIT 失败是断言（AssertionError 无 Caused by 链），只有 surefire
        # 报告文件里有完整消息；单独一步避免单步注解数超限。
        run: |
          grep -a -A 6 'vanillaPostgresWithoutPgvectorFailsBoot' \
            annona-server/target/surefire-reports/io.annona.integration.ExtensionMissingIT.txt \
            | head -7 | while IFS= read -r l; do echo "::error::${l:0:380}"; done
      - name: Report how many ran
        if: always()
        run: |
          grep -E 'Tests run:' target/docker-it.log | tail -5 || true

  # ─────────────────────────────────────────────────────────────────────
  # 3) compose 冒烟（B4 交付物的端到端；P0 出口条件 ② 的落地）
  #    这是全 CI 里唯一真正需要 docker-compose.yml 的 job——它测交付物
  #    而不是业务逻辑。慢，15-20 分钟；docs-only PR 也照常跑（pull_request
  #    不配 paths-ignore 的原因见文件顶部注释）。
  # ─────────────────────────────────────────────────────────────────────
  compose-smoke:
    name: docker compose config + bring up stack + probe /
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compose config (structural validation, incl. extends graph)
        run: |
          docker compose --env-file .env.example -f docker/docker-compose.yml config -q
          # dev 栈也校一遍：它用 extends 复用主文件的 service，但顶层命名卷必须在
          # 本项目自己声明。只校主文件时这类错根本看不见（2026-09-28 首次真跑 dev 栈撞到）
          docker compose --env-file .env.example -f docker/docker-compose.dev.yml --profile s3 config -q
      - name: Prepare .env with CI-only secrets
        run: |
          cp .env.example .env
          # 覆盖 .env.example 里的 replace-me 占位为可用的 CI 值
          sed -i 's|^ANNONA_SECRET_KEY=.*|ANNONA_SECRET_KEY='"$(openssl rand -base64 32)"'|' .env
          sed -i 's|^SPRING_DATASOURCE_PASSWORD=.*|SPRING_DATASOURCE_PASSWORD=ci-pg-pw|' .env
          sed -i 's|^S3_ACCESS_KEY=.*|S3_ACCESS_KEY=ci-minio-ak|' .env
          sed -i 's|^S3_SECRET_KEY=.*|S3_SECRET_KEY=ci-minio-sk|' .env
      # P1a-05 遗留实测 ①：Silo 镜像在 runner 上匿名 pull 可得性（此前只 pin 了 tag
      # 未实证；20260903 裸日期返 manifest unknown，真名遵循 MinIO RELEASE 惯例）。
      - name: Verify anonymous pull of pgsty/silo
        run: docker pull docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z
      - name: Bring up the full stack
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --wait
      - name: Probe /actuator/health + home page + SPA deep link
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/actuator/health | grep -q '"status":"UP"'; then
              echo "healthy after ${i} tries"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost/actuator/health | grep '"status":"UP"'
          curl -fsS http://localhost/ | grep -qi 'annona'
          # D1 SPA fallback：非根 deep link 必须回前端 shell（index.html），而不是 404
          curl -fsS http://localhost/study | grep -qi 'annona'
          # D1 边界：未映射的 /api 绝不被 SPA 回退成 index.html 外壳。P1a-02 强制鉴权后，
          # 未登录的 /api 走业务失败约定 = HTTP 200 + Result JSON(1004)，已证明它不是 HTML。
          curl -s -o /dev/null -w '%{content_type}' http://localhost/api/definitely-not-a-route | grep -qi 'application/json'
      # P1a-05 实测 ②结论：MINIO_DEFAULT_BUCKETS 在 Silo fork 上不生效（首轮 404 证伪），
      # 建桶改由 server 启动时幂等完成——本断言现在验证的正是 auto-create 的效果。
      - name: Verify the server auto-created the bucket
        run: |
          AWS_ACCESS_KEY_ID=ci-minio-ak \
          AWS_SECRET_ACCESS_KEY=ci-minio-sk \
          AWS_EC2_METADATA_DISABLED=true \
          aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket annona
      - name: Dump compose state and all logs on failure
        if: failure()
        run: |
          set -o pipefail
          {
            echo "### compose ps -a"
            docker compose --env-file .env -f docker/docker-compose.yml ps -a || true
            echo "### compose logs (tail 150, all services)"
            docker compose --env-file .env -f docker/docker-compose.yml logs --tail=150 || true
          } >> "$GITHUB_STEP_SUMMARY"
          # 把疑似根因行写进 check-run annotations（匿名可读，排障不依赖登录）
          docker compose --env-file .env -f docker/docker-compose.yml logs --tail=200 2>&1 \
            | grep -iE "ERROR|Exception|FATAL|exited|unhealthy|refused|denied|manifest" \
            | head -20 | while IFS= read -r line; do
                echo "::error::${line:0:300}"
              done || true
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml down -v

  # ─────────────────────────────────────────────────────────────────────
  # 4) 前端 typecheck + build；顺带校验 static 输出真的落到 annona-server
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: annona-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm/action-setup 读 annona-web/package.json 里的 packageManager 字段
      # 决定 pnpm 版本；放在 setup-node 之前，让 setup-node 的 cache:pnpm
      # 能拿到 pnpm 二进制定位 lockfile。
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: annona-web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: annona-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # eslint（typescript-eslint + react-hooks）：exhaustive-deps 是过期闭包类 bug 的
      # 第一道机器防线（番茄钟到期振荡即此类），rules 设 error，绿才算过
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Verify static output reached annona-server
        run: test -f ../annona-server/src/main/resources/static/index.html

  # ─────────────────────────────────────────────────────────────────────
  # 5) gitleaks 权威密钥扫描（本地 pre-commit hook 之外的第二道）
  #    Ember452 目前是个人账号，gitleaks-action@v2 对个人仓库免费；
  #    转成组织后需要 GITLEAKS_LICENSE secret。
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # fork 发来的 PR 拿不到仓库 secrets，强行跑只会红且没有诊断价值；
    # 这类 PR 由同仓库分支上的 unit + docker-it 负责把关。
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write   # gitleaks-action 需要回写 PR 评论
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 全历史扫描需要完整 fetch；PR 只 diff 模式可以省，但我们做全扫
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # 组织账号需要，个人仓库不填

  # ─────────────────────────────────────────────────────────────────────
  # 6) gate：唯一需要设进 branch protection 的必需检查
  #    gate 依赖五个 blocking job，非 success/skipped 即红；skipped 视为通过
  #    （gitleaks 对 fork PR 显式 skip）。pull_request 无 paths-ignore（原因见
  #    文件顶部），因此 gate 在任何 PR 上都会真实运行一次，必需检查不会卡 Expected。
  # ─────────────────────────────────────────────────────────────────────
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [unit, docker-it, compose-smoke, frontend, gitleaks]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Aggregate upstream job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > needs.json
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' needs.json
          if jq -e '[.[].result] | map(select(. != "success" and . != "skipped")) | length > 0' needs.json > /dev/null; then
            echo "::error::至少一个必需 job 未成功（非 success/skipped）"
            exit 1
          fi
          echo "CI gate OK"
