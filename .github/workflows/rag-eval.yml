# RAG 检索评测。仅当 retrieval / chunk / scripts/rag-eval 变更时触发；
# services 起 pgvector 复用 backend 环境。P1a-09 才落 scripts/rag-eval/，
# 目前脚本不存在时优雅 skip（保留 workflow 结构，改动检索代码不会静默漂）。
# 产物走 artifact 上传，PR 里贴报告链接（AGENTS.md §2 计划维护规则 8）。
name: RAG Eval

on:
  pull_request:
    paths:
      - 'annona-server/src/main/java/io/annona/modules/retrieval/**'
      - 'annona-server/src/main/java/io/annona/modules/knowledge/chunk/**'
      - 'scripts/rag-eval/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: Recall@K / MRR regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: annona
          POSTGRES_PASSWORD: annona
          POSTGRES_DB: annona
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U annona -d annona"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Redisson（会话/心跳时间线）在 docker profile 下是必配 bean——缺了应用起不来，
      # 2026-09-27 补（此前只有 postgres，P1a-09 落地当天 eval job 必红）
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw
        run: chmod +x mvnw
      - name: Skip when scripts/rag-eval/ not yet in tree (P1a-09 pending)
        run: |
          if [ ! -f scripts/rag-eval/eval.py ]; then
            echo "scripts/rag-eval/eval.py arrives in P1a-09; skipping"
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      - name: Build annona-server (skip tests, main CI already covers them)
        if: env.skip != 'true'
        run: ./mvnw -B -DskipTests package
      - name: Run eval against local instance
        if: env.skip != 'true'
        run: |
          java -jar annona-server/target/annona-server.jar &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              ok=1
              echo "healthy after ${i} tries"
              break
            fi
            sleep 2
          done
          # 探活失败必须硬失败：否则会对一个没起来的服务跑 eval，
          # 报错信息全是误导（此前循环等满 120s 后继续往下跑）
          if [ "$ok" != "1" ]; then
            echo "::error::annona-server did not become healthy in 120s"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          python3 scripts/rag-eval/eval.py \
            --base-url http://localhost:8080 \
            --queries scripts/rag-eval/queries.json \
            --report-dir out/rag-eval
          kill $APP_PID
        env:
          SPRING_PROFILES_ACTIVE: docker
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/annona
          SPRING_DATASOURCE_USERNAME: annona
          SPRING_DATASOURCE_PASSWORD: annona
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ANNONA_SECRET_KEY: ci-dummy-kek
      - name: Upload report artifact
        if: env.skip != 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-eval-report
          path: out/rag-eval/
          retention-days: 30
