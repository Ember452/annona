# RAG 检索评测。仅当 retrieval / chunk / db迁移 / scripts/rag-eval 变更时触发；
# services 只起 pgvector + redis；对象存储走普通 step 的 docker run（Silo 需要带
# `server /data` 子命令，services: 递不进去）——评测要 multipart 上传语料，所以 S3
# 是这个 job 的硬前置，缺它就在上传那一步爆（2026-09-28 立项时发现）。
# 另：docker run -d 起的容器没有 healthcheck，下面有显式探活 + 硬失败。
# P1a-09 才落 scripts/rag-eval/，脚本不存在时优雅 skip（保留 workflow 结构，改动检索代码不会静默漂）。
# embedding 来源条件化（retrieval-hybrid-adr §决策 9）：有 EVAL_EMBEDDING_API_KEY 就出真数字，
# 没有就退到 provider=fake 只做管道回归——fake 的召回不可读作质量，报告与
# retrieval_eval_run.embedding_provider 必须记录本轮来源。
# 产物走 artifact 上传，PR 里贴报告链接（AGENTS.md §2 计划维护规则 8）。
# workflow_dispatch 可带 inputs（queries / corpus_dir / label）：09b 这类"换评测集"
# 的决策级重跑用 dispatch 指向新集合；PR 触发的回归门仍钉默认集，互不干扰。
name: RAG Eval

on:
  pull_request:
    paths:
      - 'annona-server/src/main/java/io/annona/modules/retrieval/**'
      - 'annona-server/src/main/java/io/annona/modules/knowledge/chunk/**'
      - 'annona-server/src/main/resources/db/migration/**'
      - 'scripts/rag-eval/**'
  workflow_dispatch:
    inputs:
      queries:
        description: 'Query set JSON path (repo-relative, PR runs keep the default)'
        required: false
        default: 'scripts/rag-eval/queries.json'
        type: string
      corpus_dir:
        description: 'Corpus directory path (repo-relative)'
        required: false
        default: 'scripts/rag-eval/corpus'
        type: string
      label:
        description: 'Report label (empty falls back to ci-<sha>)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  eval:
    name: Recall@K / MRR regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: annona
          POSTGRES_PASSWORD: annona
          POSTGRES_DB: annona
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U annona -d annona"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # Redisson（会话/心跳时间线）在 docker profile 下是必配 bean——缺了应用起不来；
      # Stream 消费者另见 ANNONA_KNOWLEDGE_INGEST_ENABLED
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # 对象存储不能用 services：Silo 镜像需要带 `server /data` 子命令启动
      # （默认 CMD 是裸二进制，直接退出），而 service container 无法覆盖容器命令——
      # 写 args: 更会让整文件判 Invalid（validate-workflows.py 规则 4）。
      # 所以改成普通 step 里 docker run -d（runner 自带 Docker，命令随意传），
      # 桶由应用启动时 ensureBucketExists 幂等创建（s3-storage-silo-adr 修订 2）。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw
        run: chmod +x mvnw
      - name: Skip when scripts/rag-eval/ not yet in tree (P1a-09 pending)
        run: |
          if [ ! -f scripts/rag-eval/eval.py ]; then
            echo "scripts/rag-eval/eval.py arrives in P1a-09; skipping"
            echo "skip=true" >> "$GITHUB_ENV"
          fi
      # docker run 的 -d 容器没有 healthcheck，这里显式探活并**硬失败**：存储没起来
      # 就启动应用，会在 S3 client bean 初始化阶段炸，报错信息全在误导人
      # （compose-smoke 用 --wait 承担同一职责）
      # 对象存储：docker run -d 而非 services——原因见上方 services 块注释。
      # 命令与 compose 的 storage 服务同形状（server /data），探活下一步做
      - name: Start object storage (Silo)
        if: env.skip != 'true'
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=eval-ak-not-for-prod \
            -e MINIO_ROOT_PASSWORD=eval-sk-not-for-prod \
            -v /tmp/silo-data:/data \
            docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z \
            server /data --console-address ":9001"
      - name: Wait for object storage
        if: env.skip != 'true'
        run: |
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:9000/minio/health/live" >/dev/null 2>&1; then
              ok=1
              echo "storage healthy after ${i} tries"
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::object storage did not become healthy in 60s"
            exit 1
          fi
      - name: Build annona-server (skip tests, main CI already covers them)
        if: env.skip != 'true'
        run: ./mvnw -B -DskipTests package
      - name: Run eval against local instance
        if: env.skip != 'true'
        run: |
          java -jar annona-server/target/annona-server.jar &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              ok=1
              echo "healthy after ${i} tries"
              break
            fi
            sleep 2
          done
          # 探活失败必须硬失败：否则会对一个没起来的服务器跑 eval，报错信息全是误导
          if [ "$ok" != "1" ]; then
            echo "::error::annona-server did not become healthy in 120s"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          python3 scripts/rag-eval/eval.py \
            --base-url http://localhost:8080 \
            --queries "$EVAL_QUERIES" \
            --corpus-dir "$EVAL_CORPUS_DIR" \
            --report-dir out/rag-eval \
            --label "${EVAL_LABEL:-ci-${GITHUB_SHA::7}}" \
            --embedding-provider "$ANNONA_MODEL_EMBEDDING_PROVIDER" \
            --embedding-model "$ANNONA_DEFAULT_EMBEDDING_MODEL"
          kill $APP_PID
        env:
          # PR 触发时 inputs 为空 → 回落默认集；dispatch 时按输入指向评测集（如 09b）
          EVAL_QUERIES: ${{ inputs.queries || 'scripts/rag-eval/queries.json' }}
          EVAL_CORPUS_DIR: ${{ inputs.corpus_dir || 'scripts/rag-eval/corpus' }}
          EVAL_LABEL: ${{ inputs.label }}
          SPRING_PROFILES_ACTIVE: docker
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/annona
          SPRING_DATASOURCE_USERNAME: annona
          SPRING_DATASOURCE_PASSWORD: annona
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          ANNONA_SECRET_KEY: ci-dummy-kek
          # docker profile 默认把入库消费者关掉（application-docker.yaml），不开则
          # 上传的语料永远停在 PENDING，eval 轮询 READY 直接超时
          ANNONA_KNOWLEDGE_INGEST_ENABLED: 'true'
          # 上传语料要真对象存储：endpoint 指 localhost（应用跑在 runner 上，不在容器里）
          S3_ENABLED: 'true'
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: annona
          S3_ACCESS_KEY: eval-ak-not-for-prod
          S3_SECRET_KEY: eval-sk-not-for-prod
          # embedding 来源条件化：Secret 在 → 真模型出决策级数字；不在 → fake 只做管道回归
          ANNONA_MODEL_EMBEDDING_PROVIDER: ${{ secrets.EVAL_EMBEDDING_API_KEY != '' && 'openai-compatible' || 'fake' }}
          ANNONA_EMBEDDING_API_KEY: ${{ secrets.EVAL_EMBEDDING_API_KEY }}
          ANNONA_EMBEDDING_BASE_URL: ${{ vars.EVAL_EMBEDDING_BASE_URL }}
          ANNONA_DEFAULT_EMBEDDING_MODEL: ${{ vars.EVAL_EMBEDDING_MODEL }}
          # 维度是 V4 向量列的冻结值，换维度属于新迁移，不在 CI 里试
          ANNONA_EMBEDDING_DIMENSIONS: '1024'
      - name: Upload report artifact
        if: env.skip != 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rag-eval-report
          path: out/rag-eval/
          retention-days: 30
