# annona-spi 是对外契约 artifact（结构 §13.3；docs/specs/2026-09-25-module-granularity-adr.md
# 讲清了为什么只契约层对外）。
# 触发：v* tag；且 secrets.OSSRH_USERNAME 已配（未配的 fork PR / 首次未 setup 时跳过）。
#
# TODO(P5-05): 本 workflow 现在是“结构就位、真跑必失败”的状态，首次发布前需补三件：
#   1) 根 pom 无 distributionManagement / 也未接入 central-publishing-maven-plugin，
#      裸 `mvn deploy` 会直接报“repository element was not specified”。
#   2) Central 强制要求 -sources.jar / -javadoc.jar / GPG 签名；仓库里未配置
#      maven-source-plugin / maven-javadoc-plugin / maven-gpg-plugin。setup-java 的
#      gpg-private-key 只导入密钥，不会自动签名产物。
#   3) `-am` 会连带部署 parent pom（必需，否则第三方无法解析 annona-spi 的 parent），
#      故文档不得写“只上传一个 jar”；server/common/infrastructure 应用 maven.deploy.skip 排除。
# 详见阶段总结 §5 D11 与 D9。
name: Publish SPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Deploy annona-spi to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Skip when publishing secrets are not configured
        id: gate
        run: |
          if [ -z "${{ secrets.OSSRH_USERNAME }}" ]; then
            echo "OSSRH_USERNAME secret not set; skipping publish (expected on forks and pre-setup repos)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: chmod mvnw
        if: steps.gate.outputs.skip != 'true'
        run: chmod +x mvnw
      - name: Deploy (GPG sign + sources + javadoc jars per Central requirement)
        if: steps.gate.outputs.skip != 'true'
        run: ./mvnw -B -pl annona-spi -am -DskipTests deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
