# 发布：v* tag 触发；构建 jar + docker image 并挂到 GitHub Release。
# 不推镜像到 registry（那是 self-host 用户 pull 源码自己 build 的场景；
# 官方托管版镜像发布归 P5-05）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build jar + image and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: chmod mvnw
        run: chmod +x mvnw
      - name: Build annona-server.jar (skip tests; CI already green via required checks)
        run: ./mvnw -B -DskipTests package
      - name: Build Docker image (tag = git ref name)
        run: docker build -f docker/Dockerfile -t annona:${GITHUB_REF_NAME} .
      - name: Save image as tarball for release artifact
        run: docker save annona:${GITHUB_REF_NAME} | gzip > annona-${GITHUB_REF_NAME}-image.tar.gz
      - name: Publish GitHub Release with jar + image tarball
        uses: softprops/action-gh-release@v2
        with:
          files: |
            annona-server/target/annona-server.jar
            annona-${{ github.ref_name }}-image.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
