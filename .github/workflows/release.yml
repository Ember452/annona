# 发布：v* tag 触发；构建 jar（含前端）+ docker image 并挂到 GitHub Release。
# 不推镜像到 registry（那是 self-host 用户 pull 源码自己 build 的场景；
# 官方托管版镜像发布归 P5-05）。
#
# 注意：jar 必须先 pnpm build 再 mvn package——static/ 不入库（.gitignore），
# 跳过前端构建会打出一个首页 404 的"纯后端 jar"，与 Docker 镜像行为不一致
# （Dockerfile 在镜像里自带 web-build stage，不走本 job 的产物）。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build jar + image and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # 前端先构建进 annona-server 的 classpath static/，jar 才是完整交付物
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: annona-web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: annona-web/pnpm-lock.yaml
      - name: Build frontend into server static/
        working-directory: annona-web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: chmod mvnw
        run: chmod +x mvnw
      - name: Build annona-server.jar (skip tests; CI already green via required checks)
        run: ./mvnw -B -DskipTests package
      - name: Assert jar carries the SPA shell
        # 防"纯后端 jar"再次出现：static/ 缺失时在这里红，而不是等用户下载后发现
        run: unzip -l annona-server/target/annona-server.jar | grep -q 'BOOT-INF/classes/static/index.html'
      - name: Build Docker image (tag = git ref name)
        run: docker build -f docker/Dockerfile -t annona:${GITHUB_REF_NAME} .
      - name: Save image as tarball for release artifact
        # pipefail 必须显式开：docker save 失败时 gzip 对空输入仍返回 0，
        # 会把几十字节的坏 tar.gz 挂上 Release
        run: |
          set -o pipefail
          docker save annona:${GITHUB_REF_NAME} | gzip > annona-${GITHUB_REF_NAME}-image.tar.gz
          test "$(stat -c%s annona-${GITHUB_REF_NAME}-image.tar.gz)" -gt 1048576
      - name: Publish GitHub Release with jar + image tarball
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            annona-server/target/annona-server.jar
            annona-${{ github.ref_name }}-image.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
