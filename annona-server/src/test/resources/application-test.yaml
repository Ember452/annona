# 本机测试 profile：无 Docker 与 PG 时，Boot 会因 DataSource autoconfig 失败而无法启动 context。
# 排除数据库相关 autoconfig，让 AnnonaApplicationTests 与配置/异常测试能在无 PG/Redis 环境下运行。
# 需要真数据库的测试打 @Tag("docker") 由 CI 的 pgvector/pgvector:pg16 service 承担。
# 见 docs/specs/2026-09-25-dockerless-local-dev-adr.md
#
# 注意：Boot 4 已把 autoconfig 拆到 per-module jar 并改包路径
#   （org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration，
#     不是老 Boot 3 的 org.springframework.boot.autoconfigure.jdbc.*）。
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
  # 无 DB 的 context 冒烟：仓库依赖型 @Service 延迟到首次请求才创建，
  # 因此 test profile（排除 JPA）仍能加载 context。真实接线由 @Tag(docker) 集测在 CI 覆盖。
  main:
    lazy-initialization: true

annona:
  startup:
    require-kek: false
    check-pg-extensions: false
  # 无 JPA 的冒烟上下文：恢复调度器（@Scheduled）与任务流（SmartLifecycle）都会被
  # 强制提前实例化，test profile 显式关闭整条 knowledge 后台机器
  knowledge:
    recovery:
      enabled: false
    ingest:
      enabled: false
  # 播种器是 ApplicationRunner（强制提前实例化），无 DB 冒烟上下文里必须连同 JPA 一起关
  direction:
    seed:
      enabled: false
  # 出题 Stream 消费与恢复调度同属强制实例化的后台机器，无 DB/Redis 冒烟上下文一并关
  questionbank:
    generate:
      enabled: false
    recovery:
      enabled: false
  # 评估链同构：EvaluationStream（SmartLifecycle）/EvaluationRecoveryScheduler（@Scheduled）/
  # EvaluationTrigger（@TransactionalEventListener）都会被强制提前实例化，无 DB/Redis 冒烟上下文必须关掉；
  # EvaluationService 等普通 @Service 走懒加载不受影响
  evaluation:
    enabled: false
    recovery:
      enabled: false
  # 简历分析链同构（ResumeStream/ResumeRecoveryScheduler 强制实例化），无 DB/Redis 冒烟上下文一并关
  resume:
    enabled: false
    recovery:
      enabled: false
  # 语音链同构（voice-adr）：VoiceWebSocketConfig 是 WebSocketConfigurer，
  # DelegatingWebSocketConfiguration 强制实例化会把 voiceSessionService→JPA repository 拉醒，无 DB 冒烟上下文必须关
  voice:
    enabled: false
