# 生产环境（AGPL 自部署 / 官方托管）
# KEK 缺失时 StartupValidator 会在 Flyway 与 DataSource 初始化之前直接抛错。
# 见 docs/specs/2026-09-25-model-api-key-adr.md（明确拒绝 dev fallback 进 prod 镜像）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

server:
  # 反代（nginx 发 X-Forwarded-*）后由 Tomcat 在可信代理边界内解析真实 client IP：
  # user_session.ip 审计列与未来 IP 维度的限流都依赖它；直连部署无该头，行为不变。
  # 只认 framework 解析而不在代码里读头——直信 X-Forwarded-For 会让客户端伪造 IP
  forward-headers-strategy: framework

logging:
  level:
    io.annona: INFO
    root: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

annona:
  startup:
    require-kek: true
    check-pg-extensions: true
  kek:
    secret: ${ANNONA_SECRET_KEY:}
  session:
    # 生产默认走 TLS（prod profile 的前提就是公网 https）；纯 http 生产环境不提供
    # 默认放行——必须显式设 ANNONA_SESSION_COOKIE_SECURE=false 才能关掉（fail-closed）
    cookie-secure: ${ANNONA_SESSION_COOKIE_SECURE:true}
