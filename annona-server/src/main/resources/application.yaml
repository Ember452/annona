spring:
  application:
    name: annona
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # P1a-05：与 KnowledgeUploadService.MAX_FILE_SIZE 同口径（借 🅖 50MB）
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${SERVER_PORT:8080}

# P1a-01：Redis 会话与 session 策略。env 名与属性路径不同源，故在此显式映射
# （REDIS_HOST 只能被 relaxed binding 映到 redis.host，映不到 annona.redis.host，见阶段总结 D14 同型坑）。
annona:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
  session:
    ttl: ${ANNONA_SESSION_TTL:7d}
    cookie: ${ANNONA_SESSION_COOKIE:ANNONA_SESSION}
    # TLS 部署置 true；纯 http 自部署留 false（见 SessionProperties 注释）
    cookie-secure: ${ANNONA_SESSION_COOKIE_SECURE:false}
  # P1a-02：身份模式择一装配 IdentityProvider（local/platform/none），见
  # docs/specs/2026-09-26-identity-provider-modes-adr.md。env 名与属性路径不同源，故显式映射。
  identity:
    mode: ${ANNONA_IDENTITY_MODE:local}
    # platform 模式的受信反代头；反代必须剥离客户端同名头、实例不得被直连（信任边界）
    platform-header: ${ANNONA_IDENTITY_PLATFORM_HEADER:X-Auth-Request-Email}
    # 代码强制的代理来源共享密钥（可选，留空=退回文档式信任边界）；配置后请求须带匹配密钥头（评审 CWE-290）
    platform-secret: ${ANNONA_IDENTITY_PLATFORM_SECRET:}
    platform-secret-header: ${ANNONA_IDENTITY_PLATFORM_SECRET_HEADER:X-Auth-Request-Access-Token}
  # P1a-05：对象存储（S3 兼容，PGSTY Silo，见 docs/specs/2026-09-26-s3-storage-silo-adr.md）。
  # enabled 显式开关（默认关）：endpoint 的 yaml 映射把键恒定义为空串，不能当装配条件
  # （@ConditionalOnProperty 只判键存在，空串也命中——P1a-05 CI 实测坑，StorageConfig 注释）。
  # enabled=true 且 Key 缺失 = 配置错误，启动即抛。
  storage:
    enabled: ${S3_ENABLED:false}
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:annona}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:us-east-1}
  # P1a-05：embedding 通道（knowledge-ingestion-adr §决策 5）。none = 不装配 provider，
  # 向量化报 2310；openai-compatible = OpenAI /embeddings 协议（DashScope 兼容模式同协议）。
  # fake（P1a-09）= 确定性 1024 维向量，只供无 Key 环境跑通入库与评测管道，数字不可读作质量。
  model:
    embedding:
      provider: ${ANNONA_MODEL_EMBEDDING_PROVIDER:none}
      base-url: ${ANNONA_EMBEDDING_BASE_URL:}
      api-key: ${ANNONA_EMBEDDING_API_KEY:}
      model: ${ANNONA_DEFAULT_EMBEDDING_MODEL:}
      dimensions: ${ANNONA_EMBEDDING_DIMENSIONS:1024}
      batch-size: ${ANNONA_EMBEDDING_BATCH_SIZE:10}
      timeout-seconds: ${ANNONA_EMBEDDING_TIMEOUT_SECONDS:60}
    # P1a-08：chat 通道（qa-streaming-adr）。none = 不装配 provider，提问报 2502；
    # openai-compatible = OpenAI 兼容 /chat/completions（同步 + 流式同一实现）；
    # fake = 确定性流式回答（无 Key 环境跑通链路，内容与语义不可读作质量）。
    # 错误后移到使用点，启动不拦（同 embedding，knowledge-ingestion-adr §决策 9）。
    chat:
      provider: ${ANNONA_MODEL_CHAT_PROVIDER:none}
      base-url: ${ANNONA_CHAT_BASE_URL:}
      api-key: ${ANNONA_CHAT_API_KEY:}
      model: ${ANNONA_DEFAULT_CHAT_MODEL:}
      timeout-seconds: ${ANNONA_CHAT_TIMEOUT_SECONDS:60}
  # P1b-10：计量与配额（llmprovider-metering-adr）。daily-token-limit 每用户每日 token 上限
  # （0=不限；自部署默认宽松，托管收紧）；model-prices 单价在部署侧 yaml 手改（无 env 映射），
  # 缺键=成本列隐藏，只供面板估算不是对账单。
  usage:
    daily-token-limit: ${ANNONA_USAGE_DAILY_TOKEN_LIMIT:200000}
  # KEK 主密钥材料（model-api-key-adr §决策 2）：base 统一 env 映射，profile yaml 只覆
  # 回退值（dev 的占位 fallback / prod 强制非空由 StartupValidator 把关）。
  kek:
    secret: ${ANNONA_SECRET_KEY:}
  # P1c-08：demo 数据合成（6 周历史，供可解释面板演示与 A/B 取证）。默认关——
  # DemoSeedRunner 是 @ConditionalOnProperty(havingValue=true) 门控 bean，关时不装配
  # （全门关启动 IT 不受影响）。开：--annona.demo.enabled=true 或 ANNONA_DEMO_ENABLED=true。
  demo:
    enabled: ${ANNONA_DEMO_ENABLED:false}
  # P1b-02：结构化输出重试（出题/评估共用，StructuredOutputInvoker）。
  # 3 次是上游同款起点：多数 JSON 形状错误在第二次带反馈重试即修复。
  ai:
    structured-output:
      max-attempts: ${ANNONA_STRUCTURED_MAX_ATTEMPTS:3}
  # P1a-05：文档解析线程池（借 🅖 实测值；重 CPU/IO 小池 + 超时防损坏文件死循环）
  document-parse:
    pool-size: ${ANNONA_PARSE_POOL_SIZE:2}
    timeout: ${ANNONA_PARSE_TIMEOUT:2m}
  # P1a-07：检索后端整套选择。pgvector = 语义(HNSW) + 关键词(tsv/pg_trgm) + RRF 全含；
  # fake = 内存空命中（不接 PG 也能跑上层业务）。未知值启动即拒（RetrievalProperties），
  # 因为拼错一个字母会让"以为在用 pgvector、实际跑的是 fake"，整批评测数字跟着失真。
  retrieval:
    backend: ${ANNONA_RETRIEVAL_BACKEND:pgvector}
  # P1b-01：内置技能根目录（Spring 资源语法，classpath:/file: 均可）。
  # 子目录 = 一个技能（SKILL.md 必填 key/name/description），_shared 是公共参考池；
  # 新增内置方向 = 加目录后重启，不改代码（skill-questionbank-adr §决策 1）。
  interview:
    skill:
      root: ${ANNONA_SKILL_ROOT:classpath:skills}
  # P1b-02：出题后台机器（Stream 消费 + 恢复调度）。门控理由同 knowledge：
  # SmartLifecycle/@Scheduled 会被强制实例化，无 Redis 的冒烟上下文必须能关掉。
  questionbank:
    generate:
      enabled: ${ANNONA_QUESTIONBANK_GENERATE_ENABLED:true}
    recovery:
      enabled: ${ANNONA_QUESTIONBANK_RECOVERY_ENABLED:true}
      interval-ms: ${ANNONA_QUESTIONBANK_RECOVERY_INTERVAL_MS:60000}
  # P1c 训练决策层（planner-decision-kernel-adr）。默认值唯一出处在此（PropertiesDefaultSourceTest 机检）；
  # 常量取值依据见 PlannerProperties / MasteryModel Javadoc。P1c-08 真模型跑通 + A/B 是第一轮校准输入。
  planner:
    # 掌握度模型（§6.2）：知识型默认半衰期 21 天；k 单次增益标度；追问每层 +15% 权重。
    half-life-days: ${ANNONA_PLANNER_HALF_LIFE_DAYS:21}
    gain-k: ${ANNONA_PLANNER_GAIN_K:0.5}
    follow-up-weight: ${ANNONA_PLANNER_FOLLOW_UP_WEIGHT:0.15}
    lr-base: ${ANNONA_PLANNER_LR_BASE:0.35}
    lr-decay: ${ANNONA_PLANNER_LR_DECAY:0.02}
    lr-sample-cap: ${ANNONA_PLANNER_LR_SAMPLE_CAP:10}
    confidence-divisor: ${ANNONA_PLANNER_CONFIDENCE_DIVISOR:5}
    neutral-quality-weight: ${ANNONA_PLANNER_NEUTRAL_QUALITY_WEIGHT:0.5}
    # 规则与保护阈值（§6.4）：复习题占比上限 / 单方向占比上限 / 样本量下限 / 换模型基线场数 / 信号窗口天。
    review-ratio: ${ANNONA_PLANNER_REVIEW_RATIO:0.25}
    cap-ratio: ${ANNONA_PLANNER_CAP_RATIO:0.40}
    min-sample: ${ANNONA_PLANNER_MIN_SAMPLE:3}
    baseline-sessions: ${ANNONA_PLANNER_BASELINE_SESSIONS:3}
    # 学习侧（自习室时长）回看窗口。面试侧样本按条数取最近 10 场、不受本值限制——
    # 否则“久不练”会被窗口过滤成“数据不足”，遗忘曲线在最需要它的场景下失效（planner-adr 修订 1）。
    window-days: ${ANNONA_PLANNER_WINDOW_DAYS:14}
    # 某规则被同一用户驳回累计达此次数 → rule_reputation.disabled，规则链跳过该规则（§6.4 保护 5）。
    reject-disable-count: ${ANNONA_PLANNER_REJECT_DISABLE_COUNT:3}
    # WEAK_DIRECTION 的低分线（均分低于此 → 加压）；FORGETTING_CURVE 的掌握度底线（现值低于此 → 掺复习）。
    weak-score-threshold: ${ANNONA_PLANNER_WEAK_SCORE_THRESHOLD:60}
    forgetting-floor: ${ANNONA_PLANNER_FORGETTING_FLOOR:0.5}
    # 规则链独立开关（关任意一条其余仍产出合法计划）；matchIfMissing=true，此处显式列全为文档。
    rule:
      forgetting-curve:
        enabled: ${ANNONA_PLANNER_RULE_FORGETTING_CURVE_ENABLED:true}
      weak-direction:
        enabled: ${ANNONA_PLANNER_RULE_WEAK_DIRECTION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    io.annona: INFO
