# annona web 服务：nginx 反向代理到 server:8080。
#
# 职责边界：
#   - 静态资源不在这里 mount；B3 已把 annona-web build 输出打进 annona-server jar
#     的 classpath:/static/，由 Spring Boot 的 ResourceHttpRequestHandler 直出。
#   - SSE (`/api/stream/*`) 与 WebSocket (`/ws/voice`) 各自独立 location，
#     关掉 buffering 与 read timeout；后者路径 P3 语音面试才启用，先预留前缀。
#   - /actuator/health 供 compose web 服务自己的 healthcheck 与外部探活穿透。
#
# SPA fallback 已在 server 侧落地（config/web/SpaWebMvcConfig + SpaFallbackPolicy，
# 2026-09-26）：非 /api/**、无扩展名路径由 Spring 回退 index.html。nginx 刻意不做
# try_files——避免与 jar 内 static 出现两份真相源（本注释早前的 TODO 已过时，勿据
# 它在 nginx 层重复实现）。
#
# ⚠️ ANNONA_IDENTITY_MODE=platform 时本配置不足以保证安全（当前只按 local 模式配好）：
#   platform 模式的信任边界（specs/2026-09-26-identity-provider-modes-adr.md）要求
#   ① 剥离客户端自带的 X-Auth-Request-Email / X-Auth-Request-Access-Token（防头走私），
#   ② 由统一登录上游注入身份头，③ 注入共享密钥头（ANNONA_IDENTITY_PLATFORM_SECRET
#   对应值，代码侧常数时间比对）。参考形态（值来源按实际 SSO 方案替换）：
#     proxy_set_header X-Auth-Request-Email $upstream_http_x_auth_request_email;
#     proxy_set_header X-Auth-Request-Access-Token "<共享密钥>";
#   没有条件①②③就切 platform = 任何客户端可伪造任意身份（CWE-290）。

upstream annona_backend {
    server server:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传体积上限（未来 P1a-05 知识库文档；B4 阶段先给 20m 一个合理默认）
    client_max_body_size 20m;

    # SSE：不缓冲、长连接
    location /api/stream/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # WebSocket：语音面试（P3）预留
    location /ws/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 常规 API
    location /api/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 应用健康与度量（compose web 服务的 healthcheck 也走这里）
    location /actuator/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 其他（前端静态、/v3/api-docs、/swagger-ui）都直传到 server
    location / {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
