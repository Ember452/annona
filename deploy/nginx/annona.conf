# annona web 服务：nginx 反向代理到 server:8080。
#
# 职责边界：
#   - 静态资源不在这里 mount；B3 已把 annona-web build 输出打进 annona-server jar
#     的 classpath:/static/，由 Spring Boot 的 ResourceHttpRequestHandler 直出。
#   - SSE (`/api/stream/*`) 与 WebSocket (`/ws/voice`) 各自独立 location，
#     关掉 buffering 与 read timeout；后者路径 P3 语音面试才启用，先预留前缀。
#   - /actuator/health 供 compose web 服务自己的 healthcheck 与外部探活穿透。
#
# SPA fallback 目前不在 nginx 做 try_files（避免与 jar 内 static 出现两份真相源）；
# 直接刷 /study /interview 等 deep link 需要 server 端加 WebMvcConfigurer
# 把非 /api/** 都 forward 到 index.html。这条 TODO 归到 P1a 或部署硬化里补，
# 见 docker-compose.yml 顶部注释。

upstream annona_backend {
    server server:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传体积上限（未来 P1a-05 知识库文档；B4 阶段先给 20m 一个合理默认）
    client_max_body_size 20m;

    # SSE：不缓冲、长连接
    location /api/stream/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # WebSocket：语音面试（P3）预留
    location /ws/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 常规 API
    location /api/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 应用健康与度量（compose web 服务的 healthcheck 也走这里）
    location /actuator/ {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 其他（前端静态、/v3/api-docs、/swagger-ui）都直传到 server
    location / {
        proxy_pass http://annona_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
